<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>온도 옷장</title>
<meta name="description" content="내 옷장의 옷과 오늘 체감온도로 코디를 추천해 주는 옷장 앱">
<meta name="theme-color" content="#F2F4F6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231D3550'/%3E%3Cpath d='M32 22 L68 22 L88 36 L80 50 L70 44 L70 82 L30 82 L30 44 L20 50 L12 36 Z' fill='%23E9C46A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column; a thermal scale (cold blue → warm amber) is the only loud element, everything else is ink on cool paper. */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --sunken: #E8ECF0;
  --ink: #16202A;
  --muted: #5D6976;
  --line: #D6DCE3;
  --primary: #1D3550;
  --on-primary: #FFFFFF;
  --cold: #3D6FD6;
  --cool: #8DB3E6;
  --mild: #E9C46A;
  --warm: #E2683C;
  --good: #2E8B57;
  --bad: #C2413A;
  --f-display: "Hahmlet", "Noto Serif KR", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1318; --surface: #171E26; --sunken: #212A34; --ink: #E7ECF1; --muted: #93A0AD; --line: #2C3743;
  --primary: #CFE0F5; --on-primary: #0E1318; --cold: #6E97EC; --cool: #9DBDEB; --mild: #E7C66F; --warm: #EE8460;
  --good: #5CC08A; --bad: #EE7B73; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #171E26; --sunken: #212A34; --ink: #E7ECF1; --muted: #93A0AD; --line: #2C3743;
  --primary: #CFE0F5; --on-primary: #0E1318; --cold: #6E97EC; --cool: #9DBDEB; --mild: #E7C66F; --warm: #EE8460;
  --good: #5CC08A; --bad: #EE7B73; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
.acct { border: 0; cursor: pointer; }
.auth { max-width: 420px; margin: 24px auto 0; }
.auth h2 { font-size: 1.5rem; }
.auth .lede { color: var(--muted); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 64px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cold); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; flex-direction: column; gap: 10px; padding-block: 6px 4px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.45rem; font-weight: 800; }
.brand h1 span { color: var(--warm); }
.brand-l { font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); overflow-wrap: anywhere; }
.brand-i { letter-spacing: .02em; text-transform: none; }
.filters { gap: 10px; padding: 12px; }
.trip-day { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.trip-day:first-of-type { border-top: 0; }
.trip-day .dt { font-family: var(--f-display); font-weight: 700; line-height: 1.2; }
.trip-day .dt small { display: block; font-family: var(--f-data); font-weight: 500; font-size: .72rem; color: var(--muted); }
.strip { display: flex; gap: 6px; flex-wrap: wrap; margin-block: 6px; }
.strip .thumb, .strip .swatch { width: 40px; height: 40px; }
.pack { display: flex; flex-direction: column; gap: 4px; }
.pack label { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.pack label.done span { text-decoration: line-through; color: var(--muted); }
.trip-list { display: flex; flex-direction: column; gap: 8px; }
.trip-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunken); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.banner { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; background: var(--sunken); color: var(--muted); }
.banner.err { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); letter-spacing: .02em; }
.tag.example { background: color-mix(in srgb, var(--mild) 30%, transparent); color: var(--ink); }
.tag.live { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }

/* weather hero */
.wx { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: end; }
.wx .big { font-family: var(--f-display); font-weight: 800; font-size: 3.6rem; line-height: .95; letter-spacing: -0.03em; }
.wx .big small { font-size: 1.4rem; font-weight: 700; }
.wx dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 0.85rem; }
.wx dt { color: var(--muted); }
.wx dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; }

.scale { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--cold), var(--cool) 35%, var(--mild) 68%, var(--warm)); }
.scale .pin { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.scale .range { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--ink); border-radius: 999px; opacity: .35; }
.scale-labels { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: 0.7rem; color: var(--muted); }
.band { font-size: 0.9rem; }
.band b { font-weight: 700; }

.places { display: flex; gap: 6px; flex-wrap: wrap; }
.search { display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; }
input[type="text"], input[type="url"], input[type="number"], input[type="email"], input[type="date"], select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* outfit */
.outfit { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.outfit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.outfit-head h3 { font-size: 1.05rem; }
.piece { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.piece:last-of-type { border-bottom: 0; }
.piece .slot { font-size: 0.7rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.piece .name { font-weight: 600; overflow-wrap: anywhere; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; display: block; border: 1px solid var(--line); }
.swatch { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; }
.pts { font-family: var(--f-data); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { padding: 12px 14px; background: var(--sunken); display: flex; flex-direction: column; gap: 6px; }
.meter-bar { position: relative; height: 8px; border-radius: 999px; background: var(--line); }
.meter-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ink); }
.meter-bar .goal { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warm); }
.tips { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
.tips li { margin-left: 1.1em; }
.tips ul { margin: 0; padding: 0; }
.outfit-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }
.board-wrap { padding: 14px; border-bottom: 1px solid var(--line); background: var(--sunken); }
.board { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 14; height: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.item .ph:not(.sw) { object-fit: contain; background: #FFFFFF; }
.ai-note { font-size: 0.88rem; padding: 0 14px 12px; color: var(--ink); }

/* wardrobe */
.closet { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.item .ph { aspect-ratio: 1 / 1; max-width: 100%; width: 100%; object-fit: cover; display: block; background: var(--sunken); }
.item .ph.sw { display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.item .body { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.item .name { font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; }
.item .meta { font-size: 0.75rem; color: var(--muted); }
.item .acts { display: flex; gap: 4px; margin-top: auto; flex-wrap: wrap; }
.item .acts .btn { padding: 5px 8px; font-size: 0.78rem; }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* add */
.methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.method { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.method b { font-size: 0.95rem; }
.method span { font-size: 0.78rem; color: var(--muted); }
.method[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.templates { display: flex; flex-wrap: wrap; gap: 6px; }
.colors { display: flex; flex-wrap: wrap; gap: 6px; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); padding: 0; }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunken); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 6px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.preview-w { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
.preview-w .meter-bar { flex: 1; }
.photo-prev { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
.found { display: flex; flex-direction: column; gap: 8px; }
.found .card { padding: 12px; }
.feedback { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.feedback .btn { padding: 10px 4px; }
.log { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
.log div { display: flex; justify-content: space-between; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .outfit { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>온도<span>·</span>옷장</h1>
      <button id="saveMode" class="tag acct" type="button">불러오는 중</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-today" aria-selected="true" data-tab="today">오늘 코디</button>
      <button role="tab" id="tab-closet" aria-selected="false" data-tab="closet">내 옷장</button>
      <button role="tab" id="tab-trip" aria-selected="false" data-tab="trip">여행</button>
      <button role="tab" id="tab-add" aria-selected="false" data-tab="add">옷 추가</button>
    </nav>
  </header>

  <div id="notice" class="banner" hidden></div>

  <section id="view-auth" class="stack" hidden></section>
  <section id="view-today" class="stack"></section>
  <section id="view-closet" class="stack" hidden></section>
  <section id="view-trip" class="stack" hidden></section>
  <section id="view-add" class="stack" hidden></section>
  <input type="file" id="replaceIn" accept="image/jpeg,image/png,image/webp" hidden>
  <datalist id="brandList"></datalist>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>

// Every record is one row in closet_docs (user_id, id, data). The UI updates first, then the row is written.
async function put(id, data) {
  applyDoc(id, data); render();
  if (S.mode !== "db") return;
  const { error } = await sb.from("closet_docs").upsert({ user_id: me.id, id, data, updated_at: new Date().toISOString() });
  if (error) notice("저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.", true);
}
async function del(id) {
  S.items.delete(id); S.logs.delete(id); S.trips.delete(id); render();
  if (S.mode !== "db") return;
  const { error } = await sb.from("closet_docs").delete().eq("user_id", me.id).eq("id", id);
  if (error) notice("삭제하지 못했어요. 새로고침 후 다시 시도해 주세요.", true);
}
function applyDoc(id, d) {
  if (id.startsWith("it_")) S.items.set(id, { ...d, id });
  else if (id.startsWith("log_")) S.logs.set(id, { ...d, id });
  else if (id.startsWith("trip_")) S.trips.set(id, { ...d, id });
  else if (id === "prefs") S.prefs = { offset: 0, place: null, ...d };
}
const savePrefs = () => put("prefs", { offset: S.prefs.offset, place: S.prefs.place });

/* ---------- weather (Open-Meteo, called directly) ---------- */
async function browserJSON(url) {
  let r;
  try { r = await fetch(url); } catch { throw { code: "network" }; }
  if (!r.ok) throw { code: "http" };
  return r.json();
}
function browserErr(e) {
  switch (e?.code) {
    case "network": return "인터넷에 연결되지 않았어요. 연결을 확인하고 다시 시도해 주세요.";
    case "geo_denied": return "위치 권한이 꺼져 있어요. 브라우저 설정에서 위치를 허용하거나 도시를 골라 주세요.";
    case "geo_fail": return "현재 위치를 찾지 못했어요. 도시를 골라 주세요.";
    default: return "날씨를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
  }
}
function hereWeather() {
  if (!navigator.geolocation) { S.wxMsg = browserErr({ code: "geo_fail" }); render(); return; }
  S.wxBusy = true; S.wxMsg = ""; render();
  navigator.geolocation.getCurrentPosition(
    p => { S.wxBusy = false; loadWeather({ name: "현재 위치", lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }); },
    e => { S.wxBusy = false; S.wxMsg = browserErr({ code: e.code === 1 ? "geo_denied" : "geo_fail" }); render(); },
    { timeout: 10000, maximumAge: 600000 });
}

/* ---------- AI (Supabase Edge Function "closet-ai") ---------- */
async function ai(action, payload) {
  if (!sb || !me) throw { code: "not_granted" };
  const { data, error } = await sb.functions.invoke("closet-ai", { body: { action, ...payload } });
  if (error) {
    let code = "upstream_error";
    try { const j = await error.context?.json(); code = j?.code || code; } catch {}
    throw { code };
  }
  if (data?.error) throw { code: data.error };
  return data;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
// Shrink a photo before sending it to the server (max 1400px, JPEG).
async function toUpload(file) {
  const img = await loadImg(file), k = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  return { img, data: await blobToB64(blob), media_type: "image/jpeg" };
}

/* ---------- recommendation ---------- */
function dayInfo() {
  const d = S.wx.days[S.day] || S.wx.days[0];
  const dress = d.fmin + (d.fmax - d.fmin) * 0.35; // weighted toward the colder part of the day you're out
  const off = S.prefs.offset || 0;
  return { d, dress, eff: dress - off, effMax: d.fmax - off, range: d.max - d.min, off };
}
function colorPenalty(items) {
  const accents = new Set(items.filter(i => !COLORS[i.color]?.neutral).map(i => i.color));
  return accents.size > 2 ? 1.6 : accents.size === 2 ? 0.5 : 0;
}
function recommend(ctx = {}) {
  const all = [...S.items.values()].map(i => ({ ...i, w: warmth(i) }));
  const by = s => all.filter(i => TYPES[i.type]?.slot === s);
  const inners = by("inner"), bottoms = by("bottom");
  if (!inners.length || !bottoms.length) return { need: !inners.length ? "이너·상의" : "하의", list: [] };
  const eff = ctx.eff ?? dayInfo().eff, target = targetFor(eff), bonus = ctx.reuse;
  const recent = new Set([...S.logs.values()].filter(l => l.date !== today() && (Date.now() - new Date(l.date)) < 3 * 864e5).flatMap(l => l.itemIds || []));
  const anchorId = "anchor" in ctx ? ctx.anchor : S.anchor;
  const anchor = anchorId && all.find(i => i.id === anchorId);
  const mainAnchor = anchor && MAIN.includes(TYPES[anchor.type]?.slot) ? anchor : null;
  const combos = [];
  for (const inner of inners) for (const mid of [null, ...by("mid")]) for (const outer of [null, ...by("outer")]) for (const bottom of bottoms) {
    const pieces = [outer, mid, inner, bottom].filter(Boolean);
    if (mainAnchor && !pieces.some(p => p.id === mainAnchor.id)) continue;
    const w = pieces.reduce((a, p) => a + p.w, 0);
    let pen = Math.abs(w - target) * (w < target ? 1.3 : 1);
    pen += colorPenalty(pieces);
    if (eff >= 23 && outer) pen += 3;
    if (eff >= 25 && mid) pen += 2;
    if (eff <= 8 && !outer) pen += 4;
    if (eff < 15 && inner.type === "tee_s") pen += 2.5;
    if (eff < 15 && bottom.type === "shorts") pen += 4;
    // On trips: reuse outerwear and bottoms (fewer things to pack), but rotate the tops so days don't repeat.
    if (bonus) pen += [outer, bottom].filter(p => p && bonus.has(p.id)).length * -0.6 + [inner, mid].reduce((a, p) => a + (p ? (ctx.used.get(p.id) || 0) * 1.2 : 0), 0);
    else pen += pieces.filter(p => recent.has(p.id)).length * 0.4;
    combos.push({ outer, mid, inner, bottom, w, pen, key: pieces.map(p => p.id).join("|") });
  }
  combos.sort((a, b) => a.pen - b.pen);
  const pick = [];
  for (const c of combos) {
    if (pick.length >= 3) break;
    if (pick.every(p => MAIN.filter(s => (p[s]?.id) !== (c[s]?.id)).length >= 2)) pick.push(c);
  }
  pick.forEach((c, i) => addExtras(c, by("shoes"), by("acc"), eff, target, anchor, i));
  return { target, list: pick };
}
// Shoes and accessories are chosen after the clothes: warm ones close the remaining gap, the rest follow the palette.
function addExtras(c, shoes, accs, eff, target, anchor, rank) {
  const clothes = MAIN.map(s => c[s]).filter(Boolean);
  const fit = (it, base) => base + colorPenalty([...clothes, it]) - (COLORS[it.color]?.neutral ? 0 : 0.2);
  const anchorSlot = anchor && TYPES[anchor.type]?.slot;
  const shoePref = t => eff <= 5 ? ({ long_boots: 0, boots: 0.3, sneakers: 1.2, loafers: 1.5, sandals: 9 })[t]
    : eff <= 15 ? ({ boots: 0, long_boots: 0.2, sneakers: 0.2, loafers: 0.3, sandals: 6 })[t]
    : eff <= 23 ? ({ sneakers: 0, loafers: 0, boots: 1, long_boots: 2.5, sandals: 2 })[t]
    : ({ sandals: 0, sneakers: 0.2, loafers: 0.5, boots: 5, long_boots: 8 })[t];
  c.shoes = anchorSlot === "shoes" ? anchor : shoes.slice().sort((a, b) => fit(a, shoePref(a.type) ?? 1) - fit(b, shoePref(b.type) ?? 1))[rank % Math.max(1, Math.min(2, shoes.length))] || null;
  const acc = [];
  if (anchorSlot === "acc") acc.push(anchor);
  const has = t => acc.some(a => a.type === t), hasHat = () => acc.some(a => TYPES[a.type].hat);
  let gap = target - c.w;
  const warmOrder = ["scarf", "beanie", "gloves"];
  for (const t of warmOrder) {
    const need = t === "scarf" ? (eff <= 7 || gap > 1) : (eff <= 2 || gap > 2);
    if (!need || has(t) || (t === "beanie" && hasHat())) continue;
    const it = accs.filter(a => a.type === t).sort((a, b) => fit(a, 0) - fit(b, 0))[0];
    if (it) { acc.push(it); gap -= it.w; }
  }
  if (!hasHat() && eff > 2 && eff < 22) {
    const hat = accs.filter(a => ["beret", "cap"].includes(a.type)).sort((a, b) => fit(a, 0) - fit(b, 0))[0];
    if (hat && fit(hat, 0) < 0.6 && rank !== 1) acc.push(hat);
  }
  if (!has("bag")) { const bag = accs.filter(a => a.type === "bag").sort((a, b) => fit(a, 0) - fit(b, 0))[0]; if (bag) acc.push(bag); }
  c.acc = acc;
  c.extraW = [...acc, c.shoes].filter(Boolean).reduce((s, p) => s + (TYPES[p.type].warm ? p.w : 0), 0);
  if (c.shoes) c.key += "|" + c.shoes.id;
  acc.forEach(a => c.key += "|" + a.id);
}
function tipsFor(c) {
  const { d, effMax, range } = dayInfo(), tips = [];
  if (range >= 8 && c.outer) {
    const without = c.w - c.outer.w, need = targetFor(effMax);
    if (without >= need - 2.5) tips.push(`일교차가 ${fmt(range)}°예요. 낮에는 ${c.outer.name}을(를) 벗어도 괜찮아요.`);
    else tips.push(`일교차가 ${fmt(range)}°예요. 낮에도 아우터는 입는 게 좋아요.`);
  }
  if (d.pop >= 50) tips.push(`비 올 확률 ${d.pop}%예요. 우산을 챙기세요.`);

/* ---------- trips ---------- */
const WD = ["일", "월", "화", "수", "목", "금", "토"];

async function tripWeather(place, dates) {
  const horizon = addDays(today(), 15), fc = dates.filter(d => d >= today() && d <= horizon), rest = dates.filter(d => !fc.includes(d));
  const days = {};
  if (fc.length) {
    const j = await browserJSON(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&daily=${DAILY},precipitation_probability_max&timezone=auto&start_date=${fc[0]}&end_date=${fc[fc.length - 1]}`);
    const d = j.daily; d.time.forEach((t, i) => days[t] = { max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], fmax: d.apparent_temperature_max[i], fmin: d.apparent_temperature_min[i], pop: d.precipitation_probability_max[i] ?? 0, code: d.weather_code[i], src: "forecast" });
  }
  if (rest.length) {
    const past = rest.map(d => d < today() ? d : minusYear(d));
    const j = await browserJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${place.lat}&longitude=${place.lon}&daily=${DAILY},precipitation_sum&timezone=auto&start_date=${past.slice().sort()[0]}&end_date=${past.slice().sort().pop()}`);
    const d = j.daily, idx = Object.fromEntries(d.time.map((t, i) => [t, i]));
    rest.forEach((day, k) => { const i = idx[past[k]]; if (i == null) return; days[day] = { max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], fmax: d.apparent_temperature_max[i], fmin: d.apparent_temperature_min[i], pop: (d.precipitation_sum[i] || 0) > 1 ? 60 : 10, code: d.weather_code[i], src: day < today() ? "past" : "lastyear" }; });
  }

}
async function createTrip() {

  if (f.end < f.start) { T.msg = "끝나는 날이 시작일보다 빨라요."; render(); return; }
  const dates = dateRange(f.start, f.end);

      const r = g.results?.[0]; if (!r) throw { code: "noplace" };

async function saveTrip(t, patch) { const { id, ...rest } = t; await put(id, { ...rest, ...patch }); }
async function refreshTrip(t) {
  const T = S.trip; T.busy = true; T.msg = "날씨를 새로 받는 중이에요…"; render();
  try { const days = await tripWeather(t.place, dateRange(t.start, t.end)); if (days.length) await saveTrip(t, { days }); T.msg = "날씨를 새로 받았어요."; }

/* ---------- actions ---------- */
async function addItem(x, source, editId) {
  const id = editId || "it_" + uid(), prev = editId ? S.items.get(editId) : null;
  await put(id, { brand: (x.brand || "").trim(), name: x.name.trim(), type: x.type, color: x.color, material: x.material, thickness: x.thickness,
    photo: x.photo || null, source: prev?.source || source || "manual", createdAt: prev?.createdAt || Date.now() });
}
async function addStarter() {
  for (const n of STARTER) { const t = TEMPLATES.find(t => t.name === n); await addItem(t, "template"); }
  notice(`샘플 옷장 ${STARTER.length}벌을 넣었어요. 실제 내 옷으로 바꿔 가며 써 보세요.`);
}
async function wear(c) {
  const { eff } = dayInfo();
  const ps = piecesOf(c);
  await put("log_" + today(), { date: today(), itemIds: ps.map(p => p.id), names: ps.map(p => p.name), feel: Math.round(eff * 10) / 10, rating: null });
  notice("오늘 코디로 기록했어요. 다녀와서 어땠는지 알려 주세요.");
}
async function rate(r) {
  const l = S.logs.get("log_" + today()); if (!l || l.rating) return;
  const delta = r === "cold" ? 1 : r === "hot" ? -1 : 0;
  S.prefs.offset = Math.max(-6, Math.min(6, (S.prefs.offset || 0) + delta));
  await put(l.id, { date: l.date, itemIds: l.itemIds || [], names: l.names || [], feel: l.feel, rating: r });
  await savePrefs();
}

        <label class="f" for="cf-brand">브랜드<select id="cf-brand" data-cf="brand"><option value="">전체</option>${brands.map(b => `<option value="${esc(b)}" ${F.brand === b ? "selected" : ""}>${esc(b)} (${all.filter(i => i.brand === b).length})</option>`).join("")}<option value="_none" ${F.brand === "_none" ? "selected" : ""}>브랜드 없음</option></select></label>
        <label class="f" for="cf-mat">소재<select id="cf-mat" data-cf="material"><option value="">전체</option>${matsHere.map(k => `<option value="${k}" ${F.material === k ? "selected" : ""}>${MATERIALS[k].label}</option>`).join("")}</select></label>
        <label class="f" for="cf-sort">정렬<select id="cf-sort" data-cf="sort">${[["recent", "최근 추가순"], ["slot", "종류별"], ["brand", "브랜드순"], ["warm", "따뜻한 순"], ["worn", "많이 입은 순"], ["idle", "오래 안 입은 순"]].map(([k, l]) => `<option value="${k}" ${F.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <div class="f">두께<div class="seg">${Object.entries(THICK).map(([k, t]) => `<button type="button" data-cft="${k}" aria-pressed="${F.thickness === k}">${t.label}</button>`).join("")}</div></div>
      </div>
      <div class="f">색상<div class="colors">${colorsHere.map(k => `<button type="button" data-cfc="${k}" aria-pressed="${F.color === k}" aria-label="${COLORS[k].label}" title="${COLORS[k].label}" style="background:${COLORS[k].hex}"></button>`).join("")}</div></div>
      ${active ? `<button class="btn ghost small" id="cfReset" style="align-self:flex-start">필터 ${active}개 지우기</button>` : ""}
      </div></details>
    </div>`;
  if (S.loading) h += `<div class="card"><p class="muted">옷장을 불러오는 중이에요…</p></div>`;
  else if (!all.length) h += emptyCloset();
  else if (!list.length) h += `<div class="card empty"><p class="muted">조건에 맞는 옷이 없어요.</p><button class="btn" id="cfReset">필터 지우기</button></div>`;
  else h += `<div class="closet">${list.map(it => { const st = stats.get(it.id); return `<div class="item">${visual(it, "ph")}<div class="body">
      ${it.brand ? `<div class="brand-l">${esc(it.brand)}</div>` : ""}
      <div class="name">${esc(it.name)}</div>
      <div class="meta">${esc(COLORS[it.color]?.label)} · ${esc(MATERIALS[it.material]?.label)} · ${esc(THICK[it.thickness]?.label)}</div>
      <div class="meta">보온 <b class="num">${fmt(warmth(it))}</b>점 · ${st ? `${st.n}번 입음${daysAgo(st.last) === 0 ? " · 오늘" : ` · ${daysAgo(st.last)}일 전`}` : "아직 안 입음"}</div>
      <div class="acts">${S.confirmDel === it.id
        ? `<button class="btn danger" data-del="${it.id}">삭제</button><button class="btn" data-cancel="1">취소</button>`
        : `<button class="btn" data-anchor="${it.id}">이 옷 입고 싶어</button><button class="btn ghost" data-edit="${it.id}">수정</button><button class="btn ghost" data-ask="${it.id}" aria-label="${esc(fullName(it))} 삭제">삭제</button>`}</div>
    </div></div>`; }).join("")}</div>`;
  $("#view-closet").innerHTML = h;
}
function formHTML(x, prefix) {
  const types = SLOT_ORDER.map(s => `<optgroup label="${SLOTS[s]}">${Object.entries(TYPES).filter(([, t]) => t.slot === s).map(([k, t]) => `<option value="${k}" ${x.type === k ? "selected" : ""}>${t.label}</option>`).join("")}</optgroup>`).join("");
  const w = warmth(x);
  return `<div class="stack" data-form="${prefix}">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
      <div class="stack" style="gap:4px;align-items:center">${x.photo ? `<img class="photo-prev" src="${esc(x.photo)}" alt="">` : visual(x, "swatch")}<button type="button" class="btn ghost small" data-photo="${prefix}">${x.photo ? "사진 바꾸기" : "사진 넣기"}</button></div>
      <div class="stack" style="flex:1;min-width:0;gap:8px">
        <label class="f" for="${prefix}-brand">브랜드<input type="text" id="${prefix}-brand" data-k="brand" value="${esc(x.brand || "")}" maxlength="30" placeholder="예: 미세키서울 (없으면 비워 두기)" list="brandList"></label>
        <label class="f" for="${prefix}-name">옷 이름<input type="text" id="${prefix}-name" data-k="name" value="${esc(x.name)}" maxlength="40" placeholder="예: 언밸런스 카울 버튼 니트"></label>
      </div></div>
    <div class="grid2">
      <label class="f" for="${prefix}-type">종류<select id="${prefix}-type" data-k="type">${types}</select></label>
      <label class="f" for="${prefix}-mat">소재<select id="${prefix}-mat" data-k="material">${Object.entries(MATERIALS).map(([k, m]) => `<option value="${k}" ${x.material === k ? "selected" : ""}>${m.label}</option>`).join("")}</select></label>
    </div>
    <div class="f">색상 <span style="font-weight:500">${esc(COLORS[x.color]?.label)}</span><div class="colors">${Object.entries(COLORS).map(([k, c]) => `<button type="button" data-color="${k}" aria-pressed="${x.color === k}" aria-label="${c.label}" title="${c.label}" style="background:${c.hex}"></button>`).join("")}</div></div>
    <div class="f">두께<div class="seg">${Object.entries(THICK).map(([k, t]) => `<button type="button" data-thick="${k}" aria-pressed="${x.thickness === k}">${t.label}</button>`).join("")}</div></div>
    <div class="preview-w"><span>보온 <b class="num">${fmt(w)}</b>점</span><div class="meter-bar"><i style="width:${Math.min(100, w / 11 * 100)}%"></i></div></div>
  </div>`;
}
function renderAdd() {
  const A = S.add;
  const M = [
    ["template", "템플릿", "자주 입는 기본템을 탭 한 번에"],
    ["photo", "사진으로", "여러 벌을 한 장에 찍어도 돼요"],
    ["link", "상품 링크", "주문내역의 링크를 붙여넣기"],
    ["manual", "직접 입력", "종류·소재·두께를 골라서"],
  ];
  let h = `<h2>옷 추가</h2><div class="methods">${M.map(([k, b, s]) => `<button class="method" data-method="${k}" aria-pressed="${A.method === k}"><b>${b}</b><span>${s}</span></button>`).join("")}</div>`;
  if (A.msg) h += `<p class="banner">${esc(A.msg)}</p>`;
  if (A.method === "template") {
    h += `<div class="card"><h3>탭해서 바로 넣기</h3><div class="templates">${TEMPLATES.map((t, i) => `<button class="chip" data-tpl="${i}">${esc(t.name)}</button>`).join("")}</div>
      <p class="small muted">넣은 뒤 옷장에서 지우거나 같은 옷을 직접 입력으로 다시 등록할 수 있어요.</p></div>`;
  } else if (A.method === "photo") {
    h += `<div class="card"><h3>옷 사진 올리기</h3>
      <p class="small muted">옷 사진이나 쇼핑몰 캡처를 올리면 Claude가 옷마다 잘라서 종류·색·소재를 채워요. 한 장에 여러 벌이 있어도 돼요. 캡처는 Ctrl+V로 붙여넣어도 돼요.</p>
      <label class="btn primary" style="align-self:flex-start" for="photoIn">사진 선택</label><input type="file" id="photoIn" accept="image/jpeg,image/png,image/webp" hidden>
      ${A.photo && !A.found.length ? `<img class="photo-prev" src="${esc(A.photo)}" alt="">` : ""}</div>`;
    if (A.found.length) h += `<div class="found">${A.found.map((x, i) => `<div class="card"><div class="row between"><label class="row small" style="font-weight:600"><input type="checkbox" data-keep="${i}" ${x.keep ? "checked" : ""}> 옷장에 넣기</label><span class="tag">${i + 1}/${A.found.length}</span></div>${formHTML(x, "f" + i)}</div>`).join("")}
      <button class="btn primary" id="saveFound" style="align-self:flex-start">선택한 ${A.found.filter(x => x.keep).length}벌 저장</button></div>`;
  } else if (A.method === "link") {
    h += `<div class="card"><h3>상품 링크 붙여넣기</h3>
      <form class="search" id="linkForm"><input type="url" id="linkIn" placeholder="https://www.musinsa.com/products/..." aria-label="상품 링크"><button class="btn primary" ${A.busy ? "disabled" : ""}>읽기</button></form>
      <p class="small muted">무신사, 29CM, 유니클로 같은 쇼핑몰 상품 페이지에서 브랜드, 상품명, 소재, 상품 사진을 가져와요. 쇼핑몰이 자동 접근을 막으면 실패할 수 있어요.</p></div>`;
  } else {
    A.draft = A.draft || cleanItem({});
    h += `<div class="card"><h3>${A.editing ? "옷 정보 수정" : A.draft.source === "link" ? "상품 정보 확인" : "직접 입력"}</h3>${formHTML(A.draft, "d")}
      <div class="row"><button class="btn primary" id="saveDraft">${A.editing ? "수정 저장" : "옷장에 저장"}</button><button class="btn ghost" id="resetDraft">${A.editing ? "취소" : "초기화"}</button></div></div>`;
  }
  $("#view-add").innerHTML = h;
}
function renderAuth() {
  $("#view-auth").innerHTML = `<div class="card auth">
    <h2>내 옷장을 만들어 볼까요</h2>
    <p class="lede">이메일로 로그인하면 등록한 옷, 코디 기록, 여행 계획이 계정에 저장돼서 휴대폰과 컴퓨터 어디서든 이어서 쓸 수 있어요.</p>
    <form class="stack" id="loginForm">
      <label class="f" for="loginEmail">이메일<input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com" value="${esc(S.loginEmail || "")}"></label>
      <button class="btn primary">로그인 링크 받기</button>
    </form>
    ${S.authMsg ? `<p class="banner">${esc(S.authMsg)}</p>` : ""}
    <p class="small muted">비밀번호 없이, 메일로 온 링크를 누르면 로그인돼요. 처음이면 계정이 자동으로 만들어져요.</p>
    <button class="btn ghost" id="guestBtn" style="align-self:flex-start">로그인 없이 둘러보기 (저장 안 됨)</button>
  </div>`;
}
function render() {
  const gate = S.auth !== "unconfigured" && !me && !S.guest;
  $("#tabs").hidden = gate; $("#view-auth").hidden = !gate;
  ["today", "closet", "trip", "add"].forEach(t => { $("#view-" + t).hidden = gate || S.tab !== t; $("#tab-" + t).setAttribute("aria-selected", S.tab === t); });
  const m = $("#saveMode");
  m.textContent = S.auth === "unconfigured" ? "서버 설정 전 · 저장 안 됨" : me ? (S.loading ? "불러오는 중" : "로그아웃") : gate ? "로그인" : "로그인하고 저장하기";
  m.title = me ? `${me.email} 계정으로 로그인됨` : "";
  m.className = "tag acct" + (me && !S.loading ? " live" : "");
  if (gate) { renderAuth(); return; }
  const brands = [...new Set([...S.items.values()].map(i => (i.brand || "").trim()).filter(Boolean))];
  $("#brandList").innerHTML = brands.map(b => `<option value="${esc(b)}">`).join("");
  ({ today: renderToday, closet: renderCloset, trip: renderTrip, add: renderAdd })[S.tab]();
}

/* ---------- events ---------- */
function formTarget(el) {
  const f = el.closest("[data-form]"); if (!f) return null;
  const p = f.dataset.form;
  return p === "d" ? S.add.draft : S.add.found[+p.slice(1)];
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-tab]"); if (!b) return;
  const ds = b.dataset;
  if (ds.tab) { S.tab = ds.tab; S.confirmDel = null; render(); return; }
  if (ds.go) { S.tab = ds.go; render(); return; }
  if (ds.day) { S.day = +ds.day; render(); return; }
  if (ds.place) { loadWeather(PLACES[+ds.place]); return; }
  if (b.id === "hereBtn") { hereWeather(); return; }
  if (b.id === "guestBtn") { S.guest = true; render(); return; }
  if (b.id === "saveMode") {
    if (S.auth === "unconfigured") { notice("config.js에 Supabase 주소와 키를 넣으면 계정 저장이 켜져요."); return; }
    if (me) { if (S.confirmLogout) { S.confirmLogout = false; sb.auth.signOut(); notice(""); } else { S.confirmLogout = true; notice(`${me.email} 계정에서 로그아웃하려면 오른쪽 위 버튼을 한 번 더 눌러 주세요.`); setTimeout(() => { S.confirmLogout = false; }, 5000); } }
    else { S.guest = false; render(); }
    return;
  }
  if (b.id === "manualToggle") { S.manual = !S.manual; render(); return; }
  if (b.id === "manualApply") {
    const lo = parseFloat($("#mMin").value), hi = parseFloat($("#mMax").value);
    if (isNaN(lo) || isNaN(hi)) return;
    const a = Math.min(lo, hi), z = Math.max(lo, hi);
    S.wx = { source: "manual", place: S.wx.place, fetchedAt: "", cur: { t: z, feel: z, code: 0, wind: 0 }, days: [{ date: today(), max: z + 1, min: a + 1, fmax: z, fmin: a, pop: 0, code: S.wx.days[S.day]?.code ?? 0 }] };
    S.day = 0; S.manual = false; S.wxMsg = ""; render(); return;
  }
  if (b.id === "starter") { addStarter(); return; }
  if (b.id === "clearAnchor") { S.anchor = null; render(); return; }
  if (ds.anchor) { S.anchor = ds.anchor; S.tab = "today"; render(); window.scrollTo({ top: 0 }); return; }
  if (ds.ask) { S.confirmDel = ds.ask; render(); return; }
  if (ds.cancel) { S.confirmDel = null; render(); return; }
  if (ds.del) { if (S.anchor === ds.del) S.anchor = null; S.confirmDel = null; del(ds.del); return; }
  if (ds.wear) { wear(S.results[+ds.wear]); return; }
  if (ds.note) { styleNote(S.results[+ds.note]); return; }
  if (ds.boardbtn) { const k = S.results[+ds.boardbtn].key; S.boardOpen = S.boardOpen === k ? null : k; render(); return; }
  if (ds.saveboard) { saveBoard(+ds.saveboard); return; }
  if (ds.photo) { photoFor = ds.photo; $("#replaceIn").value = ""; $("#replaceIn").click(); return; }
  if (ds.rate) { rate(ds.rate); return; }
  if (ds.method) { S.add.method = ds.method; S.add.msg = ""; if (S.add.editing) { S.add.editing = null; S.add.draft = null; } if (ds.method === "manual" && S.add.draft?.source === "link") {} render(); return; }
  if (ds.tpl) { const t = TEMPLATES[+ds.tpl]; addItem(t, "template").then(() => { S.add.msg = `'${t.name}'을(를) 옷장에 넣었어요.`; render(); }); return; }
  if (ds.color) { const x = formTarget(b); if (x) { x.color = ds.color; render(); } return; }
  if (ds.thick) { const x = formTarget(b); if (x) { x.thickness = ds.thick; render(); } return; }
  if (b.id === "saveDraft") {
    const x = S.add.draft, ed = S.add.editing; if (!x.name.trim()) { S.add.msg = "옷 이름을 적어 주세요."; render(); return; }
    addItem(x, x.source || (x.photo ? "photo" : "manual"), ed).then(() => {
      S.add.draft = null; S.add.photo = null; S.add.editing = null;
      if (ed) { S.add.msg = ""; S.tab = "closet"; notice(`'${fullName(x)}' 정보를 고쳤어요.`); } else S.add.msg = `'${fullName(x)}'을(를) 저장했어요.`;
      render();
    }); return;
  }
  if (b.id === "resetDraft") { const ed = S.add.editing; S.add.draft = null; S.add.editing = null; S.add.msg = ""; if (ed) S.tab = "closet"; render(); return; }
  if (b.id === "saveFound") {
    const keep = S.add.found.filter(x => x.keep);
    Promise.all(keep.map(x => addItem(x, "photo"))).then(() => { S.add.msg = `${keep.length}벌을 저장했어요.`; S.add.found = []; S.add.photo = null; render(); }); return;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "photoIn" && el.files?.[0]) { analyzePhoto(el.files[0]); return; }
  if (el.id === "replaceIn" && el.files?.[0] && photoFor) { replacePhoto(photoFor, el.files[0]); photoFor = null; return; }
  if (el.dataset.keep !== undefined) { S.add.found[+el.dataset.keep].keep = el.checked; render(); return; }
  if (el.dataset.k) { const x = formTarget(el); if (x) { x[el.dataset.k] = el.value; if (el.tagName === "SELECT") render(); } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k === "name" || el.dataset.k === "brand") { const x = formTarget(el); if (x) x[el.dataset.k] = el.value; }
  if (el.id === "cq") { S.cf.q = el.value; clearTimeout(window._cqT); window._cqT = setTimeout(() => { renderCloset(); const q = $("#cq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "placeForm") searchPlace($("#placeQ").value);
  if (e.target.id === "linkForm") readLink($("#linkIn").value);
  if (e.target.id === "loginForm") { S.loginEmail = $("#loginEmail").value.trim(); if (S.loginEmail) sendLoginLink(S.loginEmail); }
});
document.addEventListener("paste", e => {
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (!file || S.tab !== "add") return;
  e.preventDefault();
  if (S.add.method === "manual" && S.add.draft) replacePhoto("d", file);
  else { S.add.method = "photo"; analyzePhoto(file); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset, F = S.cf;
  if (ds.filter) { F.slot = ds.filter; render(); }
  else if (ds.cft) { F.thickness = F.thickness === ds.cft ? "" : ds.cft; render(); }
  else if (ds.cfc) { F.color = F.color === ds.cfc ? "" : ds.cfc; render(); }
  else if (b.id === "cfReset") { Object.assign(F, { brand: "", color: "", material: "", thickness: "", q: "" }); render(); }
  else if (ds.edit) { const it = S.items.get(ds.edit); if (!it) return; S.add.editing = it.id; S.add.draft = { ...it }; S.add.method = "manual"; S.add.msg = ""; S.tab = "add"; render(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("change", e => { const el = e.target; if (el.dataset.cf) { S.cf[el.dataset.cf] = el.value; render(); } });
document.addEventListener("toggle", e => { if (e.target.id === "cfBox") S.cf.open = e.target.open; }, true);
/* trip events */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const T = S.trip, ds = b.dataset, t = T.open && S.trips.get(T.open);
  if (b.id === "tripNew") { const s = addDays(today(), 7); T.form = { name: "", place: null, q: "", start: s, end: addDays(s, 3), lo: "", hi: "" }; T.msg = ""; render(); }
  else if (b.id === "tripCancel") { T.form = null; T.msg = ""; render(); }
  else if (b.id === "tripBack") { T.open = null; T.msg = ""; S.confirmDel = null; render(); }
  else if (ds.tripopen) { T.open = ds.tripopen; T.msg = ""; render(); window.scrollTo({ top: 0 }); }
  else if (ds.tfplace) { const p = PLACES[+ds.tfplace]; T.form.place = T.form.place?.name === p.name ? null : p; if (T.form.place) T.form.q = ""; render(); }
  else if (ds.tripnext && t) { saveTrip(t, { ranks: { ...(t.ranks || {}), [ds.tripnext]: ((t.ranks || {})[ds.tripnext] || 0) + 1 } }); }
  else if (b.id === "tripRefresh" && t) refreshTrip(t);
  else if (ds.deltrip) { S.confirmDel = null; T.open = null; del(ds.deltrip); }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.tf || !S.trip.form) return;
  S.trip.form[el.dataset.tf] = el.value;
  if (el.dataset.tf === "q" && el.value.trim()) { if (S.trip.form.place) { S.trip.form.place = null; document.querySelectorAll("[data-tfplace]").forEach(c => c.setAttribute("aria-pressed", "false")); } }
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset.packed) return;
  const t = S.trips.get(S.trip.open); if (!t) return;
  saveTrip(t, { packed: { ...(t.packed || {}), [el.dataset.packed]: el.checked } });
});
document.addEventListener("submit", e => { if (e.target.id === "tripForm") { e.preventDefault(); createTrip(); } });

boot();
</script>
