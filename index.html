<style>
/* bary: warm ivory paper, deep charcoal ink, muted rose as the one accent (mauve for secondary moments).
   The thermal scale keeps its own cold → warm colors because it carries meaning. */
:root {
  --bg: #FAF8F5;
  --surface: #FFFFFF;
  --sunken: #F4EFEA;
  --tile: #F6F1EC;
  --ink: #1E1E1E;
  --muted: #8A817A;
  --line: #ECE5DE;
  --primary: #1E1E1E;
  --on-primary: #FFFFFF;
  --rose: #D4A3A3;
  --rose-ink: #A86F6F;
  --rose-soft: #F5E6E3;
  --mauve: #8E7DBE;
  --mauve-soft: #ECE8F5;
  --shadow: 0 1px 2px rgb(70 50 40 / .04), 0 8px 24px rgb(70 50 40 / .06);
  --cold: #6E8FD0;
  --cool: #A9C2E4;
  --mild: #E9C98F;
  --warm: #D98A6C;
  --good: #5E9C7A;
  --bad: #C0534D;
  --f-display: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --f-body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-data: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  --r: 16px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171514; --surface: #211E1C; --sunken: #2A2623; --tile: #F1EBE5; --ink: #F1ECE6; --muted: #A79D95; --line: #36312D;
  --primary: #F1ECE6; --on-primary: #171514; --rose: #D9AAAA; --rose-ink: #E3B4B4; --rose-soft: #3A2C2B; --mauve: #A797D3; --mauve-soft: #2E2A3A;
  --cold: #8AA6DE; --cool: #A9C2E4; --mild: #E7C98F; --warm: #E39A7E;
  --good: #7DBB98; --bad: #E6827B; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171514; --surface: #211E1C; --sunken: #2A2623; --tile: #F1EBE5; --ink: #F1ECE6; --muted: #A79D95; --line: #36312D;
  --primary: #F1ECE6; --on-primary: #171514; --rose: #D9AAAA; --rose-ink: #E3B4B4; --rose-soft: #3A2C2B; --mauve: #A797D3; --mauve-soft: #2E2A3A;
  --cold: #8AA6DE; --cool: #A9C2E4; --mild: #E7C98F; --warm: #E39A7E;
  --good: #7DBB98; --bad: #E6827B; --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
.acct { border: 0; cursor: pointer; }
.auth { max-width: 420px; margin: 24px auto 0; }
.auth h2 { font-size: 1.5rem; }
.auth .lede { color: var(--muted); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cold); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 10px; padding-block: 10px 8px; margin-inline: -16px; padding-inline: 16px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; line-height: 0; }
.logo { all: unset; cursor: pointer; border-radius: 8px; display: inline-flex; color: var(--ink); }
.logo svg { height: 30px; width: auto; display: block; }
.logo:focus-visible { outline: 2px solid var(--mauve); outline-offset: 3px; }
.master { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; background: linear-gradient(160deg, var(--rose-soft), var(--mauve-soft)); }
.master .gl { background: var(--surface); }
.theme-btn { border: 0; background: var(--sunken); color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.theme-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.theme-opt { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--ink); }
.theme-opt i { width: 44px; height: 30px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.theme-opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.brand-l { font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); overflow-wrap: anywhere; }
.brand-i { letter-spacing: .02em; text-transform: none; }
.filters { gap: 10px; padding: 12px; }
.pack { display: flex; flex-direction: column; gap: 4px; }
.pack label { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.pack label.done span { text-decoration: line-through; color: var(--muted); }
.trip-list { display: flex; flex-direction: column; gap: 8px; }
.trip-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
/* bottom navigation: floats above the content, in the thumb zone */
.bnav { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 520px); height: var(--nav-h);
  display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: center; padding: 0 6px; border-radius: 26px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgb(70 50 40 / .14), 0 0 0 1px var(--line); }
.bnav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: .68rem; font-weight: 600; letter-spacing: -.01em; border-radius: 16px; }
.bnav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.bnav button[aria-selected="true"] { color: var(--ink); }
.bnav button[aria-selected="true"] svg { stroke-width: 2; transform: translateY(-1px); }
.bnav button[aria-selected="true"] span::after { content: ""; display: block; width: 4px; height: 4px; margin: 2px auto 0; border-radius: 50%; background: var(--rose); }
.bnav .fab { justify-self: center; width: 54px; height: 54px; padding: 0; border-radius: 50%; justify-content: center; color: #fff; margin-top: -18px;
  background: linear-gradient(145deg, var(--rose), var(--mauve)); box-shadow: 0 8px 20px color-mix(in srgb, var(--mauve) 40%, transparent), 0 0 0 4px var(--bg); }
.bnav .fab svg { width: 26px; height: 26px; stroke-width: 2.2; }
.bnav .fab[aria-selected="true"] { color: #fff; }
.bnav .fab[aria-selected="true"] svg { transform: rotate(90deg); }
.bnav .fab span::after { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* screen changes: a soft fade + rise */
@media (prefers-reduced-motion: no-preference) {
  .enter { animation: enter .32s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .sheet:not([hidden]) .sheet-bg { animation: fade .25s ease both; }
  .sheet:not([hidden]) .sheet-body { animation: slideUp .34s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
}

.banner { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; background: var(--sunken); color: var(--muted); }
.banner.err { color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 0.88rem; transition: transform .12s ease, background .15s ease; }
.btn:hover { border-color: var(--rose); }
.btn:active, .chip:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 0.84rem; font-weight: 500; transition: background .15s ease, color .15s ease; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); letter-spacing: 0; }
.tag.rose { background: var(--rose-soft); color: var(--rose-ink); }
.tag.example { background: color-mix(in srgb, var(--mild) 30%, transparent); color: var(--ink); }
.tag.live { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }

/* weather hero */
.wx { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: end; }
.wx .big { font-family: var(--f-serif); font-weight: 600; font-size: 4.4rem; line-height: .85; letter-spacing: -0.03em; font-variant-numeric: lining-nums; }
.wx .big small { font-size: 2rem; font-weight: 500; color: var(--rose-ink); vertical-align: top; }
.wx dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 0.85rem; }
.wx dt { color: var(--muted); }
.wx dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; }

.scale { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--cold), var(--cool) 35%, var(--mild) 68%, var(--warm)); }
.scale .pin { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.scale .range { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--ink); border-radius: 999px; opacity: .35; }
.scale-labels { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: 0.7rem; color: var(--muted); }
.band { font-size: 0.9rem; }
.band b { font-weight: 700; }

.places { display: flex; gap: 6px; flex-wrap: wrap; }
.search { display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; }
input[type="text"], input[type="password"], input[type="url"], input[type="number"], input[type="email"], input[type="date"], select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* outfit */
.meter-bar { position: relative; height: 8px; border-radius: 999px; background: var(--line); }
.meter-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ink); }
.meter-bar .goal { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warm); }
.board { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 14; height: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }

/* wardrobe */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.item .body { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.item .name { font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; }
.item .meta { font-size: 0.75rem; color: var(--muted); }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* add */
.colors { display: flex; flex-wrap: wrap; gap: 6px; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); padding: 0; }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunken); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 6px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.preview-w { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
.preview-w .meter-bar { flex: 1; }
.photo-prev { width: 96px; height: 96px; border-radius: 12px; object-fit: contain; background: var(--tile); }
.form-ph { width: 96px; }
.found { display: flex; flex-direction: column; gap: 8px; }
.found .card { padding: 12px; }
@media (prefers-reduced-motion: no-preference) { .outfit { animation: rise .25s ease-out both; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }

/* ---------- moodboard look ---------- */
.card { border: 0; border-radius: 22px; box-shadow: var(--shadow); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: block; }
.chip .ell { display: inline-block; max-width: 11em; vertical-align: bottom; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec-head .seg { flex: 0 1 260px; }
.sec-sub { margin-top: 4px; }
.ask-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; padding: 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.badge-line { font-size: .78rem; color: var(--muted); }
.pill { flex: none; font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink); white-space: nowrap; }

.outfit { display: flex; flex-direction: column; overflow: hidden; border: 0; border-radius: 20px; box-shadow: var(--shadow); background: var(--surface); }
.o-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 16px 10px; }
.o-title { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.o-title h3 { font-size: 1.05rem; }
.o-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.board-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px; }
.board-grid .tile:first-child { grid-column: span 2; grid-row: span 2; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; border-radius: 14px; }
.tile:focus-visible { outline: 2px solid var(--cold); outline-offset: 2px; }
.tile-img { display: grid; place-items: center; aspect-ratio: 1 / 1; width: 100%; border-radius: 14px; background: var(--tile); overflow: hidden; transition: transform .15s ease; }
.board-grid .tile:first-child .tile-img { aspect-ratio: auto; flex: 1; min-height: 0; }
.tile-img img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.tile-img svg { width: 62%; height: 62%; }
.tile:hover .tile-img { transform: scale(1.015); }
.tile-cap { display: flex; flex-direction: column; min-width: 0; padding: 0 2px; line-height: 1.25; }
.tile-k { font-size: .66rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-n { font-size: .78rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.add .plus { display: grid; place-items: center; aspect-ratio: 1 / 1; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font-size: 1.6rem; font-weight: 300; }
.tile.add .tile-cap { font-size: .75rem; color: var(--muted); text-align: center; }
.o-warm { padding: 14px 16px 4px; }
.o-warm .meter-bar { height: 4px; background: var(--sunken); }
.o-warm .meter-bar .goal { top: -3px; bottom: -3px; }
.o-notes { padding: 8px 16px 0; font-size: .8rem; color: var(--muted); }
.o-notes summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o-notes summary::-webkit-details-marker { display: none; }
.o-notes[open] summary { white-space: normal; }
.o-notes ul { margin: 6px 0 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 3px; }
.o-foot { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 16px 16px; }
.o-foot .btn { border-radius: 999px; padding: 8px 14px; }
.o-foot .btn.icon { background: var(--sunken); border-color: transparent; }
.ai-note { font-size: 0.88rem; padding: 10px 16px 0; color: var(--ink); }
.board-wrap { margin: 0 12px 10px; padding: 0; border: 0; background: transparent; }
.day-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 2px -8px; }
.day-n { font-family: var(--f-display); font-weight: 700; }
.trip-item { display: flex; gap: 6px; align-items: stretch; }
.trip-item .trip-row { flex: 1; min-width: 0; }
.trip-item .btn.icon { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.pick-box summary { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pack-chip.must { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pack-chip.skip { text-decoration: line-through; color: var(--muted); background: var(--sunken); }

/* closet */

.tile.mini.sel .tile-img { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--rose-ink); }

/* bulk register from a screenshot */

.bulk-ph-acts button { border: 0; background: none; padding: 0; font-size: .7rem; font-weight: 600; color: var(--muted); text-decoration: underline; }
.searching { animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
.gem-set { background: var(--sunken); border-radius: 14px; padding: 10px 14px; }

/* add: capture banner, compact method row, quick picker */
.cap-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; color: #fff;
  background: radial-gradient(120% 140% at 0% 0%, #E7BDB6 0%, var(--rose) 38%, var(--mauve) 100%); box-shadow: 0 10px 26px color-mix(in srgb, var(--mauve) 30%, transparent); }

.gl { border: 0; background: var(--surface); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; }

/* today: TPO chips, beauty & fashion brief */

// Every record is one row in closet_docs (user_id, id, data). The UI updates first, then the row is written.
async function put(id, data) {
  applyDoc(id, data); render();
  if (S.mode !== "db") return;
  const { error } = await sb.from("closet_docs").upsert({ user_id: me.id, id, data, updated_at: new Date().toISOString() });
  if (error) notice("저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.", true);
}
async function del(id) {
  if (S.items.delete(id)) S.itemRev = (S.itemRev || 0) + 1;
  S.logs.delete(id); S.trips.delete(id); render();
  if (S.mode !== "db") return;
  const { error } = await sb.from("closet_docs").delete().eq("user_id", me.id).eq("id", id);
  if (error) notice("삭제하지 못했어요. 새로고침 후 다시 시도해 주세요.", true);
}
// Delete several records in one request (e.g. all sample clothes).
async function delMany(ids) {
  if (!ids.length) return;
  ids.forEach(id => { S.items.delete(id); S.logs.delete(id); S.trips.delete(id); });
  S.itemRev = (S.itemRev || 0) + 1; S.anchors = S.anchors.filter(id => !ids.includes(id)); render();
  if (S.mode !== "db") return;
  const { error } = await sb.from("closet_docs").delete().eq("user_id", me.id).in("id", ids);
  if (error) notice("일부를 삭제하지 못했어요. 새로고침 후 다시 시도해 주세요.", true);
}
function applyDoc(id, d) {
  if (id.startsWith("it_")) { S.items.set(id, { ...d, id }); S.itemRev = (S.itemRev || 0) + 1; }
  else if (id.startsWith("log_")) S.logs.set(id, { ...d, id });
  else if (id.startsWith("trip_")) S.trips.set(id, { ...d, id });
  else if (id === "prefs") S.prefs = { offset: 0, place: null, ...d };
}
const savePrefs = () => put("prefs", { offset: S.prefs.offset, place: S.prefs.place, mode: S.prefs.mode || "balance", tpo: S.prefs.tpo || null, catVer: S.prefs.catVer || 0 });
// One-time fix for items the old name parser put in the wrong slot (a belt as a leather jacket, a padded
// jacket as a T-shirt). Only a slot change counts: if the user had corrected an item, the new guess agrees with it.
const CAT_VER = 2;
async function migrateTypes() {
  if ((S.prefs.catVer || 0) >= CAT_VER) return;
  const fixes = [];
  for (const it of S.items.values()) {
    const g = guessType(it.name);
    if (g && TYPES[g].slot !== TYPES[it.type]?.slot) fixes.push({ it, g });
  }
  for (const { it, g } of fixes) {
    const { id, ...rest } = it, m = guessItem(it.name).material;
    await put(id, { ...rest, type: g, material: m || rest.material });
  }
  S.prefs.catVer = CAT_VER; await savePrefs();
  if (fixes.length) notice(`새 분류 기준으로 옷 ${fixes.length}벌의 종류를 고쳤어요: ${fixes.slice(0, 3).map(f => TYPES[f.g].label).join(", ")}${fixes.length > 3 ? " 등" : ""}.`);
}

async function boot() {

  // consumes (and clears) it: the PASSWORD_RECOVERY event can fire before any listener is attached.
  const link = new URLSearchParams(location.hash.slice(1) + "&" + location.search.slice(1));
  if (link.get("type") === "recovery") { S.recovery = true; S.authMsg = ""; }
  if (link.get("error_code")) { S.authErr = true; S.authMsg = link.get("error_code") === "otp_expired" ? "메일 링크가 만료됐거나 이미 쓰였어요. '비밀번호를 잊었어요'로 새 메일을 받아 주세요." : "메일 링크로 들어오지 못했어요. 다시 시도해 주세요."; history.replaceState(null, "", location.pathname); }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

  sb.auth.onAuthStateChange((e, session) => { if (e === "PASSWORD_RECOVERY") { S.recovery = true; S.authMsg = ""; } setTimeout(() => onSession(session), 0); });

}
// Email + password. Sign-up logs in right away when "Confirm email" is off in Supabase.
function authErr(error) {

  if (c === "user_already_exists" || /already registered/i.test(m)) return "이미 가입된 이메일이에요. 로그인해 주세요.";
  if (c === "weak_password" || /password should/i.test(m)) return "비밀번호는 6자 이상으로 해 주세요.";
  if (c === "email_not_confirmed") return "메일 인증이 아직 안 됐어요. 메일함의 인증 링크를 한 번 눌러 주세요.";
  if (c === "validation_failed" || /email/i.test(m) && /invalid/i.test(m)) return "이메일 주소를 확인해 주세요.";
  if (error?.status === 429) return S.authMode === "reset" || S.authMode === "signup"
    ? "메일은 한 시간에 몇 통만 보낼 수 있어서 잠시 막혔어요. 메일함에 이미 온 bary(Supabase) 메일이 있다면 그 링크를 눌러 주세요. 없으면 한 시간쯤 뒤에 다시 받아 주세요."
    : "시도가 너무 많아요. 잠시 후 다시 해 주세요.";
  return "잠시 후 다시 시도해 주세요. (" + (m || "연결 오류").slice(0, 80) + ")";
}
async function authSubmit() {
  const mode = S.authMode || "login", email = ($("#loginEmail")?.value || "").trim(), pw = $("#loginPw")?.value || "";
  S.loginEmail = email;
  if (mode !== "newpw" && !email) { S.authMsg = "이메일을 넣어 주세요."; S.authErr = true; render(); return; }
  if ((mode === "signup" || mode === "newpw") && pw.length < 6) { S.authMsg = "비밀번호는 6자 이상으로 해 주세요."; S.authErr = true; render(); return; }
  if ((mode === "signup" || mode === "newpw") && pw !== ($("#loginPw2")?.value || "")) { S.authMsg = "비밀번호 확인이 달라요."; S.authErr = true; render(); return; }
  S.authBusy = true; S.authMsg = ""; render();
  let error, data;
  if (mode === "login") ({ error } = await sb.auth.signInWithPassword({ email, password: pw }));
  else if (mode === "signup") {
    ({ data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } }));
    // Supabase answers a sign-up for an existing email without a session or identities.
    if (!error && data?.user && !data.user.identities?.length) error = { code: "user_already_exists" };
    else if (!error && !data?.session) { S.authBusy = false; S.authErr = false; S.authMsg = `${email}로 인증 메일을 보냈어요. 메일의 링크를 한 번 누르면 가입이 끝나요.`; render(); return; }
  } else if (mode === "reset") {
    ({ error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }));
    if (!error) { S.authBusy = false; S.authErr = false; S.authMsg = `${email}로 비밀번호 재설정 메일을 보냈어요. 메일의 링크를 누르면 새 비밀번호를 정할 수 있어요.`; render(); return; }
  } else if (mode === "newpw") {
    ({ error } = await sb.auth.updateUser({ password: pw }));
    if (!error) { S.recovery = false; S.authMode = "login"; S.authBusy = false; S.authMsg = ""; render(); toast("새 비밀번호로 바꿨어요."); return; }
  }
  S.authBusy = false; S.authErr = !!error; S.authMsg = error ? authErr(error) : ""; render();
}

/* ---------- weather (Open-Meteo, called directly) ---------- */
async function browserJSON(url) {
  let r;
  try { r = await fetch(url); } catch { throw { code: "network" }; }
  if (!r.ok) throw { code: "http" };
  return r.json();
}
function browserErr(e) {
  switch (e?.code) {
    case "network": return "인터넷에 연결되지 않았어요. 연결을 확인하고 다시 시도해 주세요.";
    case "geo_denied": return "위치 권한이 꺼져 있어요. 브라우저 설정에서 위치를 허용하거나 도시를 골라 주세요.";
    case "geo_fail": return "현재 위치를 찾지 못했어요. 도시를 골라 주세요.";
    default: return "날씨를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
  }
}
function hereWeather() {
  if (!navigator.geolocation) { S.wxMsg = browserErr({ code: "geo_fail" }); render(); return; }
  S.wxBusy = true; S.wxMsg = ""; render();
  navigator.geolocation.getCurrentPosition(
    p => { S.wxBusy = false; LS.set("bary.locAsked", "1"); loadWeather({ name: "현재 위치", here: true, lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }); },
    e => { S.wxBusy = false; LS.set("bary.locAsked", "1"); S.wxMsg = browserErr({ code: e.code === 1 ? "geo_denied" : "geo_fail" }); render(); autoWeather(true); },
    { timeout: 10000, maximumAge: 600000 });
}

/* ---------- AI (Supabase Edge Function "closet-ai") ---------- */
async function ai(action, payload) {
  if (!sb || !me) throw { code: "not_granted" };
  const { data, error } = await sb.functions.invoke("closet-ai", { body: { action, ...payload } });
  if (error) {
    let code = "upstream_error";
    try { const j = await error.context?.json(); code = j?.code || code; } catch {}
    throw { code };
  }
  if (data?.error) throw { code: data.error };
  return data;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
// Shrink a photo before sending it to the server (max 1400px, JPEG).
async function toUpload(file) {
  const img = await loadImg(file), k = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  return { img, data: await blobToB64(blob), media_type: "image/jpeg" };
}
// save: remember this place (only when the user picked it; the automatic first load doesn't write prefs).
async function loadWeather(place, save = true) {
  S.wxBusy = true; S.wxMsg = ""; render();
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&hourly=relative_humidity_2m,apparent_temperature,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,weather_code,uv_index_max,wind_speed_10m_max&timezone=auto&forecast_days=7`;
    const j = await browserJSON(u);
    const d = j.daily, hr = j.hourly || { time: [], relative_humidity_2m: [] };
    // Humidity while you're out (09~21시), averaged per day.
    const hum = date => { const v = hr.time.map((t, i) => [t, hr.relative_humidity_2m[i]]).filter(([t, x]) => t.startsWith(date) && +t.slice(11, 13) >= 9 && +t.slice(11, 13) <= 21 && x != null).map(([, x]) => x); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
    S.wx = { source: "live", place: place.name, fetchedAt: (j.current?.time || "").replace("T", " "),
      cur: { t: j.current.temperature_2m, feel: j.current.apparent_temperature, code: j.current.weather_code, wind: j.current.wind_speed_10m, hum: j.current.relative_humidity_2m },
      days: d.time.map((t, i) => ({ date: t, max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], fmax: d.apparent_temperature_max[i], fmin: d.apparent_temperature_min[i], pop: d.precipitation_probability_max[i], code: d.weather_code[i],
        uv: d.uv_index_max?.[i] ?? null, wmax: d.wind_speed_10m_max?.[i] ?? null, hum: hum(t) })),
      // Every hour of the 7 days (place's local time); the home screen picks the hours it shows.
      now: (j.current?.time || "").slice(0, 13),
      hourly: hr.time.map((t, i) => ({ t, h: +t.slice(11, 13), feel: hr.apparent_temperature?.[i], code: hr.weather_code?.[i], pop: hr.precipitation_probability?.[i] ?? 0 })) };
    S.manual = false; if (save) { S.prefs.place = place; savePrefs(); }
  } catch (e) { S.wxMsg = browserErr(e); }

}
async function searchPlace(q) {
  if (!q.trim()) return;
  S.wxBusy = true; S.wxMsg = ""; render();
  try {
    const j = await browserJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=1&language=ko`);
    const r = j.results?.[0];
    if (!r) { S.wxBusy = false; S.wxMsg = `'${q}'을(를) 찾지 못했어요. 도시 이름으로 다시 검색해 주세요.`; render(); return; }
    S.wxBusy = false;
    await loadWeather({ name: r.name + (r.country ? ", " + r.country : ""), lat: r.latitude, lon: r.longitude });
  } catch (e) { S.wxBusy = false; S.wxMsg = browserErr(e); render(); }

async function createTrip() {
  const T = S.trip, f = T.form;
  if (!f.name.trim() || !f.start || !f.end) { T.msg = "여행 이름과 날짜를 모두 넣어 주세요."; render(); return; }
  if (f.end < f.start) { T.msg = "끝나는 날이 시작일보다 빨라요."; render(); return; }
  const dates = dateRange(f.start, f.end);
  T.busy = true; T.msg = "여행지 날씨를 불러오는 중이에요…"; render();
  let place = f.place, days = [], note = "";
  try {
    if (!place && f.q.trim()) {
      const g = await browserJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(f.q.trim())}&count=1&language=ko`);
      const r = g.results?.[0]; if (!r) throw { code: "noplace" };
      place = { name: r.name + (r.country ? ", " + r.country : ""), lat: r.latitude, lon: r.longitude };
    }
    if (!place) throw { code: "noplace" };
    days = await tripWeather(place, dates);
  } catch (e) {
    if (e?.code === "noplace") { T.busy = false; T.msg = "여행지를 찾지 못했어요. 도시를 고르거나 이름을 다시 적어 주세요."; render(); return; }
    note = browserErr(e);
  }
  if (days.length < dates.length) {
    const lo = parseFloat(f.lo), hi = parseFloat(f.hi);
    if (isNaN(lo) || isNaN(hi)) { T.busy = false; T.msg = (note ? note + " " : "") + "날씨를 다 불러오지 못했어요. 아래 '예상 체감온도'를 넣으면 그 기온으로 계획해요."; T.form.needManual = true; render(); return; }
    const have = new Set(days.map(d => d.date));
    dates.filter(d => !have.has(d)).forEach(date => days.push({ date, max: hi + 1, min: lo + 1, fmax: Math.max(lo, hi), fmin: Math.min(lo, hi), pop: 0, code: 1, src: "manual" }));
    days.sort((a, b) => a.date.localeCompare(b.date));
  }
  const id = "trip_" + uid();
  await put(id, { name: f.name.trim(), place: place || { name: f.q.trim() || "여행지" }, start: f.start, end: f.end, days, ranks: {}, packed: {}, createdAt: Date.now() });
  T.busy = false; T.msg = ""; T.form = null; T.open = id; render();
}
// must: clothes to bring (each is worn at least once, earliest days first). skip: clothes left at home.
// edits: days the user changed by hand, saved as item ids.
function tripPlan(t) {
  const must = (t.must || []).filter(id => S.items.has(id)), skip = new Set(t.skip || []);
  const reuse = new Set(must), used = new Map(), off = S.prefs.offset || 0, worn = new Set();
  const days = (t.days || []).map(d => {
    const eff = d.fmin + (d.fmax - d.fmin) * 0.35 - off;
    const X = ctxFor({ eff, day: d, wind: 0, reuse, used, tpo: null });
    let c = t.edits?.[d.date] ? cardFromIds(t.edits[d.date], X) : null, rec = { target: X.target };
    if (!c) {
      rec = recommend({ eff, day: d, wind: 0, reuse, used, tpo: null, anchors: must.filter(id => !worn.has(id)), exclude: skip });
      c = rec.list.length ? rec.list[(t.ranks?.[d.date] || 0) % rec.list.length] : null;
    }
    if (c) piecesOf(c).forEach(p => { reuse.add(p.id); worn.add(p.id); used.set(p.id, (used.get(p.id) || 0) + 1); });
    return { d, eff, rec, c, target: X.target };
  });
  const pack = [...reuse].filter(id => !skip.has(id) || worn.has(id)).map(id => S.items.get(id)).filter(Boolean).map(withW);
  return { days, pack };
}

async function saveTrip(t, patch) { const { id, ...rest } = t; await put(id, { ...rest, ...patch }); }
async function refreshTrip(t) {
  const T = S.trip; T.busy = true; T.msg = "날씨를 새로 받는 중이에요…"; render();
  try { const days = await tripWeather(t.place, dateRange(t.start, t.end)); if (days.length) await saveTrip(t, { days }); T.msg = "날씨를 새로 받았어요."; }
  catch (e) { T.msg = browserErr(e); }
  T.busy = false; render();
}

/* ---------- actions ---------- */
async function addItem(x, source, editId) {
  const id = editId || "it_" + uid(), prev = editId ? S.items.get(editId) : null;
  await put(id, { brand: (x.brand || "").trim(), name: x.name.trim(), type: x.type, color: x.color, material: x.material, thickness: x.thickness,
    fit: FITS[x.fit] ? x.fit : "", mood: MOODS[x.mood] ? x.mood : "",
    photo: x.photo || null, source: prev?.source || source || "manual", createdAt: prev?.createdAt || Date.now() });
}
// "이 옷 입고 싶어": several picks; up to 3 per slot (the oldest one in that slot is dropped).
function toggleAnchor(id) {
  const it = S.items.get(id); if (!it) return;
  if (S.anchors.includes(id)) { S.anchors = S.anchors.filter(x => x !== id); render(); return; }
  const same = S.anchors.filter(x => S.items.get(x) && slotKey(S.items.get(x)) === slotKey(it));
  if (same.length >= 3) { S.anchors = S.anchors.filter(x => x !== same[0]); notice(`같은 종류는 3개까지 고를 수 있어서 '${S.items.get(same[0]).name}' 선택을 해제했어요.`); }
  else notice("");
  S.anchors.push(id); render();
}
// A sample from 샘플 옷장으로 시작. Older samples were saved as "template", like one-tap template adds,
// so those only count when the name is one of the starter set (and the user hasn't edited it).
const isSample = i => i.source === "sample" || (i.source === "template" && STARTER.includes(i.name));
async function addStarter() {
  for (const n of STARTER) { const t = TEMPLATES.find(t => t.name === n); await addItem(t, "sample"); }
  notice(`샘플 옷장 ${STARTER.length}벌을 넣었어요. 실제 내 옷으로 바꿔 가며 써 보세요.`);
}
// One day's OOTD record: worn items, feel, feedback, and the day's photo / memo / TPO tag.
// Every write merges into what's there, so changing one part never drops the others.
async function putLog(date, patch) {
  const { id, ...prev } = S.logs.get("log_" + date) || {};
  await put("log_" + date, { date, itemIds: [], names: [], feel: null, rating: null, photo: null, memo: "", tpo: null, ...prev, ...patch });
}
// Save what was worn on any day (from the calendar). Keeps that day's feedback; the feel is known only for today.
async function saveDayLog(date, ids) {
  const ps = ids.map(id => S.items.get(id)).filter(Boolean); if (!ps.length) return;
  const prev = S.logs.get("log_" + date);
  closeSheet();
  await putLog(date, { itemIds: ps.map(p => p.id), names: ps.map(p => p.name), feel: date === today() ? Math.round(dayInfo().eff * 10) / 10 : prev?.feel ?? null });
  toast(prev ? "기록을 고쳤어요." : "📅 캘린더에 기록했어요. 체감이 어땠는지도 남겨 주세요.");
  openSheet({ kind: "log", date });
}
async function wear(c) {
  const { eff } = dayInfo();
  const ps = piecesOf(c);
  // Re-recording keeps the day's feedback so the learned correction isn't counted twice.
  const prev = S.logs.get("log_" + today());
  await putLog(today(), { itemIds: ps.map(p => p.id), names: ps.map(p => p.name), feel: Math.round(eff * 10) / 10 });
  toast("📅 OOTD 캘린더에 기록했어요. 저녁에 체감 피드백도 남겨 주세요.");
}
// Evening feedback teaches the personal correction: 추웠어요 +1°, 더웠어요 −1° (kept within ±6°).
// offset > 0 means "runs cold": the day is treated as that much colder, so warmer outfits come up.
const FEEL = [["cold", "추웠어요 🥶"], ["ok", "딱 좋았어요 🥰"], ["hot", "더웠어요 🥵"]];
const FEEL_EMO = { cold: "🥶", ok: "🥰", hot: "🥵" };
const feelDelta = r => r === "cold" ? 1 : r === "hot" ? -1 : 0;
const feelLabel = off => off >= 2 ? "추위를 많이 타는 편" : off === 1 ? "추위를 조금 타는 편" : off <= -2 ? "더위를 많이 타는 편" : off === -1 ? "더위를 조금 타는 편" : "보통 체질";
async function rate(r, date = today()) {
  const l = S.logs.get("log_" + date); if (!l || l.rating === r) return;
  // Changing an earlier answer undoes its correction first.
  S.prefs.offset = Math.max(-6, Math.min(6, (S.prefs.offset || 0) - feelDelta(l.rating) + feelDelta(r)));
  await putLog(l.date, { rating: r });
  await savePrefs();
  const off = S.prefs.offset;
  toast(`🌡️ 배웠어요 · ${feelLabel(off)}${off ? ` (${off > 0 ? "+" : "−"}${Math.abs(off)}°C 보정)` : ""}`);
}

/* ---------- home: greeting, weather icons, at a glance ---------- */
// Hours for the strip: today from now on, other days from midnight. step 3 normally, 1 in 더보기.
function hoursFor(W, day, step) {
  const d = W.days?.[day]; if (!W.hourly?.length || !d) return [];
  const list = W.hourly.filter(x => x.t.startsWith(d.date) && (day !== 0 || x.t.slice(0, 13) >= W.now));
  // Today late at night: carry on into tomorrow so the strip isn't nearly empty.
  const more = day === 0 && list.length < 24 / step * 2 ? W.hourly.filter(x => x.t.slice(0, 13) > (list.at(-1)?.t || W.now).slice(0, 13)).slice(0, 24 - list.length) : [];
  return [...list, ...more].filter((_, i) => i % step === 0).slice(0, step === 1 ? 24 : 8);
}
const dayLabel = i => { const d = S.wx.days?.[i]; if (i === 0) return "오늘"; if (i === 1) return "내일"; if (i === 2) return "모레"; if (!d) return ""; const x = new Date(d.date + "T00:00:00"); return `${x.getMonth() + 1}/${x.getDate()}(${WD[x.getDay()]})`; };
const WICON = c => c == null ? "🌡️" : c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌦️" : c <= 86 ? "🌨️" : "⛈️";
// A greeting plus today's suggestion in one line: "트렌치코트에 니트, 슬랙스 어때요?"
function helloHTML(rec, eff) {
  const now = new Date(), hr = now.getHours();
  const hi = hr < 5 ? "늦은 밤이에요" : hr < 11 ? "좋은 아침이에요" : hr < 17 ? "좋은 오후예요" : "편안한 저녁이에요";
  const c = rec?.list?.[0], parts = c ? [c.outer, c.mid || c.inner, c.bottom].filter(Boolean).map(p => TYPES[p.type].label.split(/[·(]/)[0].trim()) : [];
  const line = S.day !== 0 ? `${dayLabel(S.day)}은 체감 ${fmt(eff)}°예요.` : parts.length ? `오늘은 <b>${esc(parts.slice(0, -1).join(", "))}에 ${esc(parts[parts.length - 1])}</b> 어때요?` : S.items.size ? `오늘 체감은 ${fmt(eff)}°예요.` : "옷장을 채우면 매일 아침 코디를 골라 드려요.";
  return `<section class="hello"><p class="small muted">${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일</p><h2>${hi}</h2><p class="hello-line">${line}</p></section>`;
}
// Three tiles that lead elsewhere: closet size, this week's OOTD, the next trip.
function glanceHTML() {
  const t0 = today(), monday = addDays(t0, -((new Date().getDay() + 6) % 7));
  const week = [...S.logs.values()].filter(l => l.date >= monday && l.date <= t0).length;
  const next = [...S.trips.values()].filter(t => t.end >= t0).sort((a, b) => a.start.localeCompare(b.start))[0];
  const dd = next ? Math.round((new Date(next.start) - new Date(t0)) / 864e5) : null;
  return `<div class="glance">

/* ---------- weather beauty & fashion brief ---------- */
// Hair hold: humidity frizzes curls, wind undoes them, rain does both.
function beautyBrief(d) {
  const hum = d.hum ?? (S.day === 0 ? S.wx.cur?.hum : null), wind = d.wmax ?? (S.day === 0 ? S.wx.cur?.wind : null), out = [];
  if (hum != null) {
    const score = 3 - (hum >= 75 ? 2 : hum >= 60 ? 1 : 0) - (wind >= 30 ? 1 : wind >= 20 ? 0.5 : 0) - ((d.pop || 0) >= 50 ? 1 : 0), s = Math.max(1, Math.round(score));
    const why = `습도 ${hum}%${wind != null ? ` · 바람 ${Math.round(wind)}km/h` : ""}`;
    out.push(["💇‍♀️", `고데기 유지력 <span class="stars" aria-label="${s}점">${"★".repeat(s)}${"☆".repeat(3 - s)}</span>`, s >= 3 ? `${why}. 컬이 저녁까지 예쁘게 가요.` : s === 2 ? `${why}. 오후엔 컬이 살짝 풀릴 수 있어요. 가벼운 고정 스프레이를 챙겨요.` : `${why}. 컬이 금방 풀리는 날이에요. 묶음 머리나 컬 고정템을 추천해요.`]);
  }
  if (d.uv != null) {
    const u = Math.round(d.uv);
    out.push(["☀️", `자외선 ${u >= 8 ? "매우 강함" : u >= 6 ? "강함" : u >= 3 ? "보통" : "낮음"}`, u >= 8 ? `지수 ${u}. 선크림을 두세 시간마다 덧바르고, 양산이나 모자를 꼭 챙겨요.` : u >= 6 ? `지수 ${u}. 외출 30분 전 선크림은 필수예요. 선글라스도 좋아요.` : u >= 3 ? `지수 ${u}. 데일리 선크림이면 충분해요.` : `지수 ${u}. 그래도 얇게 선크림은 발라 주세요.`]);
  }
  const range = d.max - d.min;
  if (!isNaN(range)) out.push(["🧥", range >= 10 ? `일교차 ${fmt(range)}° · 아우터 필수` : range >= 7 ? `일교차 ${fmt(range)}° · 걸칠 옷 챙기기` : `일교차 ${fmt(range)}° · 한 벌로 OK`,
    range >= 10 ? `아침저녁엔 ${fmt(d.fmin)}°까지 내려가요. 벗고 입기 쉬운 아우터를 꼭 챙겨요.` : range >= 7 ? "저녁엔 쌀쌀해져요. 가디건이나 얇은 아우터를 가방에 넣어 두세요." : "하루 종일 기온이 비슷해서 입고 나간 그대로 편하게 다녀요."]);
  return out;
}
function briefHTML(d) {
  const rows = beautyBrief(d); if (!rows.length) return "";
  return `<section class="brief" aria-label="뷰티·패션 지수"><h3><span>오늘의 뷰티·패션 지수</span><span class="muted small">${dayLabel(S.day)}</span></h3>
    ${rows.map(([ico, t, x]) => `<div class="brief-row"><span aria-hidden="true">${ico}</span><span><b>${t}</b><br><span class="muted">${esc(x)}</span></span></div>`).join("")}</section>`;
}

const APP_URL = "https://uouclaudecode-cpu.github.io/ondo-closet/";

/* ---------- OOTD calendar ---------- */
// This month at a glance: days recorded, longest streak, most-worn clothes, clothes left in the closet, the month's colors.
function monthReportHTML(month, inMonth, y, m) {
  if (!inMonth.length) return "";
  const dates = new Set(inMonth.map(l => l.date));
  let best = 0, run = 0;
  for (let d = 1; d <= new Date(y, m, 0).getDate(); d++) { if (dates.has(`${month}-${String(d).padStart(2, "0")}`)) best = Math.max(best, ++run); else run = 0; }
  const count = new Map();
  inMonth.forEach(l => (l.itemIds || []).forEach(id => { if (S.items.has(id)) count.set(id, (count.get(id) || 0) + 1); }));
  const top = [...count].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, n]) => [S.items.get(id), n]);
  const sleeping = [...S.items.values()].filter(i => isMain(i) && !count.has(i.id));
  const colors = new Map();
  inMonth.forEach(l => (l.itemIds || []).map(id => S.items.get(id)).filter(p => p && isMain(p)).forEach(p => colors.set(p.color, (colors.get(p.color) || 0) + 1)));
  const tot = [...colors.values()].reduce((a, b) => a + b, 0), cs = [...colors].sort((a, b) => b[1] - a[1]);
  const tpos = new Map(); inMonth.forEach(l => l.tpo && tpos.set(l.tpo, (tpos.get(l.tpo) || 0) + 1));
  const topTpo = [...tpos].sort((a, b) => b[1] - a[1])[0];
  return `<div class="card"><div class="row between"><h3>${m}월 OOTD 리포트</h3><span class="tag rose">최장 연속 ${best}일</span></div>
    <div class="glance rep"><div class="gl"><span class="gl-k">기록한 날</span><b>${inMonth.length}<small>일</small></b></div><div class="gl"><span class="gl-k">입은 옷</span><b>${count.size}<small>벌</small></b></div><div class="gl"><span class="gl-k">자주 간 곳</span><b class="sm">${topTpo ? esc(TPO[topTpo[0]].label) : "—"}</b></div></div>
    ${tot ? `<div class="f">이달의 컬러</div><div class="cbar" aria-hidden="true">${cs.map(([k, n]) => `<i style="flex:${n};background:${COLORS[k]?.hex || "#999"}" title="${esc(COLORS[k]?.label || "")}"></i>`).join("")}</div>
      <p class="small muted">${cs.slice(0, 3).map(([k, n]) => `${COLORS[k]?.label} ${Math.round(n / tot * 100)}%`).join(" · ")}</p>` : ""}
    ${top.length ? `<div class="f">가장 많이 입은 옷</div><div class="rank">${top.map(([p, n], i) => `<div class="rank-row"><span class="rank-n">${i + 1}</span><span class="tile-img sm">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : silhouetteSVG(p)}</span><span class="ell">${esc(p.name)}</span><span class="muted small">${n}번</span></div>`).join("")}</div>` : ""}
    ${sleeping.length ? `<details class="o-notes"><summary>💤 이번 달 한 번도 안 입은 옷 ${sleeping.length}벌</summary><p class="small muted" style="margin-top:6px">${sleeping.slice(0, 12).map(p => esc(p.name)).join(", ")}${sleeping.length > 12 ? " 외" : ""}</p><button class="btn small" data-wakeup="1" style="margin-top:8px">이 중 하나로 오늘 코디 짜기</button></details>` : ""}
  </div>`;
}
// Days that felt like today (±2°), most recent first: what worked before in this weather.
function similarDaysHTML() {
  const { eff } = dayInfo(), t0 = today();
  const days = [...S.logs.values()].filter(l => l.date < t0 && l.feel != null && Math.abs(l.feel - eff) <= 2 && (l.itemIds || []).some(id => S.items.has(id)))
    .sort((a, b) => (b.rating === "ok") - (a.rating === "ok") || b.date.localeCompare(a.date)).slice(0, 3);

  return `<div class="card"><div class="row between"><h3>오늘과 비슷한 체감이었던 날</h3><span class="tag">체감 ${fmt(eff)}° ± 2°</span></div>

function sheetAction(act) {

    if (act === "edit") { closeSheet(); S.add.editing = it.id; S.add.draft = { ...it }; S.add.method = "manual"; S.add.msg = ""; S.tab = "add"; render(); window.scrollTo({ top: 0 }); }

    if (act === "delok") { closeSheet(); S.anchors = S.anchors.filter(x => x !== it.id); del(it.id); }
    return;

  const { c, t, skip, save } = cardAt(s.where), p = c && findIn(c, s.id);
  if (!p) return closeSheet();
  if (act === "swap") {
    const nu = swapItem(c, p, skip, s.where + "|" + slotKey(p));
    if (!nu) { toast("바꿔 넣을 다른 옷이 없어요."); return; }
    save(c); S.sheet = { ...s, id: nu.id }; renderSheet(); return;
  }
  if (act === "clear") { putIn(c, p, null); rescore(c); save(c); closeSheet(); return; }
  if (act === "ban" && !t) {
    // Today: never suggest it again today, and refill every card that had it.
    S.ban.add(p.id);
    for (const card of S.results) { const q = findIn(card, p.id); if (q && !refill(card, q, S.ban)) toast("대신 넣을 옷이 없어서 그대로 뒀어요."); }
    save(); closeSheet(); toast(`'${p.name}'을(를) 뺐어요.`); return;
  }
  if (act === "ban" || act === "skiptrip") {
    const sk = new Set([...skip, p.id]);
    if (!refill(c, p, sk)) { toast("대신 넣을 옷이 없어요."); return; }
    if (act === "skiptrip") {
      const edits = { ...(t.edits || {}), [s.where.split(":")[2]]: idsOfCard(c) };

// Rename a trip or move its dates. Weather is fetched again for the new dates; edits on dates that remain are kept.
async function saveTripEdit() {
  const s = S.sheet, t = S.trips.get(s.id), f = s.form;
  if (!t) return closeSheet();
  if (!f.name.trim() || !f.start || !f.end) { s.msg = "여행 이름과 날짜를 모두 넣어 주세요."; s.err = true; return renderSheet(); }
  if (f.end < f.start) { s.msg = "마지막 날이 시작일보다 빨라요."; s.err = true; return renderSheet(); }
  const dates = dateRange(f.start, f.end), keep = new Set(dates);
  const sameDates = f.start === t.start && f.end === t.end;
  let days = t.days;
  if (!sameDates) {
    s.busy = true; s.msg = ""; renderSheet();
    let fresh = [];
    if (t.place?.lat != null) { try { fresh = await tripWeather(t.place, dates); } catch { fresh = []; } }
    // Dates the weather service could not give: reuse a day we already had, else the trip's average.
    const old = new Map(t.days.map(d => [d.date, d])), got = new Map(fresh.map(d => [d.date, d]));
    const avg = k => t.days.reduce((a, d) => a + d[k], 0) / Math.max(1, t.days.length);
    days = dates.map(date => got.get(date) || old.get(date) || { date, max: avg("max"), min: avg("min"), fmax: avg("fmax"), fmin: avg("fmin"), pop: 0, code: 1, src: "manual" });
    s.busy = false;
  }
  const pick = o => Object.fromEntries(Object.entries(o || {}).filter(([d]) => keep.has(d)));
  await saveTrip(t, { name: f.name.trim(), start: f.start, end: f.end, days, edits: pick(t.edits), ranks: pick(t.ranks) });
  closeSheet(); toast("여행을 수정했어요.");
}

        search_not_configured: "상품 사진 검색이 아직 설정되지 않았어요. (Supabase에 네이버 검색 키를 넣으면 켜져요)",
        search_bad_key: "네이버 검색 키가 맞지 않아요. Supabase Secrets의 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 값과, 네이버 앱에 '검색' API가 추가돼 있는지 확인해 주세요.",
        rate_limited: "네이버 검색 요청이 많아서 잠시 막혔어요. 조금 뒤 다시 시도해 주세요.",
      }[e?.code] || `상품 사진 검색에 실패했어요. (${e?.code || "알 수 없는 오류"})`;
    }
    renderBulk();
  }));
}
// Shrink a photo for storage (longest side 800px, JPEG).
function shrink(img, max = 800) {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.86);
}
async function bulkFile(file) {
  if (B.busy) return;
  if (S.tab !== "add" || S.add.method !== "capture") { S.tab = "add"; S.add.method = "capture"; S.add.editing = null; render(); }
  if (!me) return; // the capture section only shows the login prompt
  if (!file?.type?.startsWith("image/")) { B.msg = "이미지 파일(JPG, PNG, WEBP)을 올려 주세요."; B.err = true; renderBulk(); return; }
  B.items = []; B.err = false; B.photoNote = "";
  let img;
  try { img = await loadImg(file); } catch { B.msg = "이미지를 열 수 없어요. 다른 파일로 시도해 주세요."; B.err = true; renderBulk(); return; }
  B.preview = cropTo(img);
  if (!canCapture()) { B.settings = !!me && !S.gemShared; B.msg = gemErr({ code: me ? (S.gemShared ? "no_key" : "gemini_not_configured") : "login_needed" }); B.err = true; renderBulk(); return; }
  if (gemShared() && !S.master && S.gemQuota && S.gemQuota.used >= S.gemQuota.limit) { B.msg = gemErr({ code: "daily_limit" }); B.err = true; renderBulk(); return; }
  B.busy = true; B.msg = `${gemShared() ? "bary 공용 AI" : gemModel()}로 캡처를 읽는 중이에요… (보통 5~20초)`; renderBulk();
  try {
    // Long order screenshots keep enough resolution for small product names (longest side 2048px).
    const k = Math.min(1, 2048 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.9).split(",")[1];
    const raw = (await callGemini(data, "image/jpeg")).slice(0, 30);
    B.items = raw.map(cleanGemini);
    B.items.forEach((x, i) => cropMine(x, img, raw[i]?.box_2d));
    const cropped = B.items.filter(x => x.mine).length;
    B.msg = B.items.length ? `${B.items.length}벌을 찾았어요${cropped ? ` (올린 사진에서 ${cropped}벌을 잘라 냈어요)` : " (올린 사진에서는 옷 위치를 못 찾았어요)"}. 맞는지 확인하고 등록해 주세요.` : "이미지에서 패션 아이템을 찾지 못했어요. 다른 캡처로 시도해 주세요.";
    B.err = !B.items.length;
  } catch (e) { B.msg = gemErr(e); B.err = true; if (["no_key", "bad_key", "bad_model"].includes(e?.code)) B.settings = true; }
  B.busy = false; renderBulk();
  if (B.items.length) findPhotos();
}
const isCapture = () => S.tab === "add" && S.add.method === "capture";
// Redraw the capture section (it lives in the 옷 추가 tab) without losing the field being typed in.
function renderBulk() {
  if (!isCapture()) return;
  const a = document.activeElement, sel = a?.dataset?.bk ? `[data-bk="${a.dataset.bk}"][data-bi="${a.dataset.bi}"]` : a?.id ? "#" + a.id : null;
  const pos = a && "selectionStart" in a ? a.selectionStart : null;
  renderAdd();
  const n = sel && document.querySelector(sel);
  if (n && n !== document.activeElement) { n.focus(); if (pos != null && n.setSelectionRange && n.type !== "checkbox") try { n.setSelectionRange(pos, pos); } catch {} }
}
function bulkPhoto(x, i) {
  if (x.search === "busy") return `<span class="tile-img sm searching" aria-label="사진 찾는 중">${silhouetteSVG(x)}</span>`;
  const url = !x.noPhoto && x.cands[x.ci];
  return `<span class="tile-img sm">${url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" onerror="bulkImgFail(${i}, this.getAttribute('src'))">` : silhouetteSVG(x)}</span>
    <span class="bulk-ph-acts">${url ? `<span>${url === x.mine ? "내 사진" : "쇼핑몰 사진"}${x.cands.length > 1 ? ` ${x.ci + 1}/${x.cands.length}` : ""}</span>` : ""}${url && x.cands.length > 1 ? `<button type="button" data-bnext="${i}">다른 사진</button>` : ""}${url ? `<button type="button" data-bnophoto="${i}">사진 빼기</button>` : !x.noPhoto ? `<span>${x.search === "none" ? "사진 없음" : ""}</span>` : `<button type="button" data-bphoto="${i}">사진 넣기</button>`}</span>`;
}
// A found photo that does not load: try the next candidate, then fall back to the illustration.
// The same broken image can report twice (one per redraw), so remove it by address, not by position.
window.bulkImgFail = (i, src) => {
  const x = B.items[i], k = x ? x.cands.indexOf(src) : -1; if (k < 0) return;
  x.cands.splice(k, 1); if (x.ci >= x.cands.length) x.ci = 0; if (!x.cands.length) x.search = "none"; renderBulk();
};
// One line about the shared AI: remaining uses today, or what to do to get it.
function sharedLine() {
  if (gemKey()) return S.gemShared ? `<p class="small muted">내 Gemini 키로 읽어요. 키를 지우면 bary 공용 AI(하루 ${S.gemQuota?.limit ?? 10}회)를 써요.</p>` : "";
  if (!S.gemShared) return "";
  if (S.master) return `<p class="banner">👑 마스터 계정 · bary 공용 AI를 횟수 제한 없이 써요${S.gemQuota ? ` (오늘 ${S.gemQuota.used}회 사용)` : ""}</p>`;
  const q = S.gemQuota, left = q ? Math.max(0, q.limit - q.used) : null;
  return `<p class="banner">✨ bary 공용 AI로 읽어요 · ${left == null ? "하루 한도 안에서 무료" : left ? `오늘 <b>${left}</b> / ${q.limit}회 남았어요` : "오늘 횟수를 다 썼어요. 내일 다시 쓸 수 있어요"}</p>`;
}
function bulkHTML() {
  // Signed out: the capture uses the account's shared AI, so the only thing to do here is log in.
  if (!me) return `<div class="card capture empty"><h3>로그인하면 바로 쓸 수 있어요</h3>
    <p class="small muted">AI 캡처 등록은 로그인한 계정에서만 쓸 수 있어요. 로그인하면 키 없이 주문내역 캡처 한 장으로 여러 벌을 한 번에 등록해요.</p>
    <button class="btn primary" data-login="1">로그인하기</button></div>`;
  const n = B.items.filter(x => x.keep).length, hasKey = !!gemKey();
  const typeOpts = x => SLOT_ORDER.map(s => `<optgroup label="${SLOTS[s]}">${Object.entries(TYPES).filter(([, t]) => t.slot === s).map(([k, t]) => `<option value="${k}" ${x.type === k ? "selected" : ""}>${t.label}</option>`).join("")}</optgroup>`).join("");
  const opts = (o, v, f, auto) => (auto ? `<option value="">${auto}</option>` : "") + Object.entries(o).map(([k, x]) => `<option value="${k}" ${v === k ? "selected" : ""}>${f(x)}</option>`).join("");
  return `<div class="card capture">
    <h3>주문내역 캡처로 한 번에 등록</h3>
    <p class="small muted">무신사·29CM 주문 내역이나 옷 사진을 올리면 Gemini가 옷마다 브랜드·상품명·색을 읽고, 쇼핑몰에서 선명한 상품 사진을 찾아 넣어요.</p>
    ${sharedLine()}
    <details class="gem-set" ${B.settings || (!hasKey && !S.gemShared) ? "open" : ""}><summary>⚙️ ${S.gemShared ? "내 키 쓰기 (선택)" : "Gemini 설정"} <span class="muted small">${hasKey ? `내 키 사용 중 · ${esc(gemModel())}` : S.gemShared ? "없어도 돼요" : "API 키가 필요해요"}</span></summary>
      <div class="stack" style="margin-top:10px">
        <label class="f" for="gemKey">Gemini API Key<input type="password" id="gemKey" autocomplete="off" spellcheck="false" placeholder="${hasKey ? "저장됨 (바꾸려면 새로 입력)" : "API 키 붙여넣기"}"></label>
        <label class="f" for="gemModel">모델명<input type="text" id="gemModel" value="${esc(LS.get("ondo.geminiModel"))}" placeholder="${GEMINI_DEFAULT_MODEL}" spellcheck="false"></label>
        <div class="row"><button class="btn primary" id="gemSave">저장</button>${hasKey ? `<button class="btn ghost danger" id="gemClear">키 지우기</button>` : ""}</div>
        <p class="small muted">키는 이 브라우저(localStorage)에만 저장돼요. 캡처를 올릴 때마다 이미지와 함께 monogpt.kr 라우터로 보내져요. 다른 사람과 같이 쓰는 컴퓨터라면 다 쓴 뒤 '키 지우기'를 눌러 주세요.</p>
      </div></details>
    <label class="drop${B.busy ? " busy" : ""}" for="bulkIn" id="bulkDrop">
      ${B.preview && !B.items.length ? `<img src="${esc(B.preview)}" alt="올린 캡처">` : `<b>캡처 선택</b>`}
      <span>또는 Ctrl+V로 붙여넣기 · 여기에 끌어다 놓기</span></label>
    ${B.msg ? `<p class="banner${B.err ? " err" : ""}">${esc(B.msg)}</p>` : ""}
    ${B.photoNote ? `<p class="small muted">${esc(B.photoNote)}</p>` : ""}
    ${B.items.length ? `<div class="bulk-list">${B.items.map((x, i) => `
      <div class="bulk-row${x.keep ? "" : " off"}">
        <label class="bulk-check"><input type="checkbox" data-bkeep="${i}" ${x.keep ? "checked" : ""} aria-label="${esc(x.name)} 등록"></label>
        <div class="bulk-ph">${bulkPhoto(x, i)}</div>
        <div class="bulk-fields">
          <div class="grid2"><input type="text" data-bk="brand" data-bi="${i}" value="${esc(x.brand)}" placeholder="브랜드" aria-label="브랜드" list="brandList"><input type="text" data-bk="name" data-bi="${i}" value="${esc(x.name)}" placeholder="옷 이름" aria-label="옷 이름"></div>
          <div class="bulk-sel">
            <select data-bk="type" data-bi="${i}" aria-label="종류">${typeOpts(x)}</select>
            <select data-bk="color" data-bi="${i}" aria-label="색상">${opts(COLORS, x.color, c => c.label)}</select>
            <select data-bk="fit" data-bi="${i}" aria-label="핏">${opts(FITS, x.fit, f => f, "핏 자동")}</select>
            <select data-bk="thickness" data-bi="${i}" aria-label="두께">${opts(THICK, x.thickness, t => t.label)}</select>
          </div>
          ${x.option ? `<div class="small muted ell">옵션: ${esc(x.option)}</div>` : ""}
        </div>
      </div>`).join("")}</div>
      <button class="btn primary" id="bulkSave" ${n && !B.busy ? "" : "disabled"}>${B.busy ? "등록하는 중…" : `선택한 옷 일괄 등록 (${n}개)`}</button>` : ""}
  </div>`;
}
// Download each chosen photo through the server (so it can be stored and drawn on the outfit board), then save.
async function bulkSave() {
  const keep = B.items.filter(x => x.keep && x.name.trim());
  if (!keep.length || B.busy) return;
  B.busy = true; B.msg = "옷장에 넣는 중이에요… (상품 사진 내려받는 중)"; B.err = false; renderBulk();
  let noPhoto = 0;
  for (const x of keep) {
    const url = !x.noPhoto && x.cands[x.ci];
    let photo = null;
    if (url?.startsWith("data:")) photo = url; // the crop from your own image is already sized for storage
    else if (url && me) {
      try { const out = await ai("image", { url }); photo = shrink(await loadImg(await (await fetch(out.image)).blob())); } catch { photo = null; }
    }
    if (!photo) noPhoto++;
    await addItem({ ...x, photo }, "capture");
  }
  B.busy = false; B.items = []; B.preview = null; B.msg = ""; B.photoNote = "";
  S.tab = "closet"; render();
  toast(`${keep.length}벌을 옷장에 등록했어요.${noPhoto ? ` (${noPhoto}벌은 종류별 그림으로 넣었어요)` : ""}`);
}
document.addEventListener("click", e => {
  const b = e.target.closest("#gemSave, #gemClear, #bulkSave, [data-bnext], [data-bnophoto], [data-bphoto]"); if (!b) return;
  const ds = b.dataset;
  if (ds.bnext) { const x = B.items[+ds.bnext]; x.ci = (x.ci + 1) % x.cands.length; renderBulk(); }
  else if (ds.bnophoto) { B.items[+ds.bnophoto].noPhoto = true; renderBulk(); }
  else if (ds.bphoto) { B.items[+ds.bphoto].noPhoto = false; renderBulk(); }
  else if (b.id === "gemSave") {
    const k = $("#gemKey").value.trim(), m = $("#gemModel").value.trim();
    if (k) LS.set("ondo.geminiKey", k);
    const ok = LS.set("ondo.geminiModel", m && m !== GEMINI_DEFAULT_MODEL ? m : "");
    B.settings = false; B.err = !ok || !gemKey();
    B.msg = !ok ? "이 브라우저에서는 설정을 저장할 수 없어요. (개인정보 보호 모드인지 확인해 주세요)" : gemKey() ? `저장했어요. 모델: ${gemModel()}` : "API 키를 입력해 주세요.";
    renderBulk();
  }
  else if (b.id === "gemClear") { LS.set("ondo.geminiKey", ""); B.settings = true; B.msg = "API 키를 지웠어요."; B.err = false; renderBulk(); }
  else if (b.id === "bulkSave") bulkSave();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "bulkIn" && el.files?.[0]) { bulkFile(el.files[0]); el.value = ""; return; }
  if (el.dataset.bkeep !== undefined) { B.items[+el.dataset.bkeep].keep = el.checked; renderBulk(); return; }
  if (el.dataset.bk && el.tagName === "SELECT") { B.items[+el.dataset.bi][el.dataset.bk] = el.value; if (el.dataset.bk === "type" || el.dataset.bk === "color") renderBulk(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.bk && el.tagName === "INPUT") B.items[+el.dataset.bi][el.dataset.bk] = el.value; });
// Drag & drop: onto the capture section, or anywhere on the closet screen (it opens the capture section).
const dropOK = () => isCapture() || S.tab === "closet";
document.addEventListener("dragover", e => { if (dropOK()) { e.preventDefault(); $("#bulkDrop")?.classList.add("over"); } });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("#bulkDrop")?.classList.remove("over"); });
document.addEventListener("drop", e => {
  if (!dropOK()) return;
  e.preventDefault(); $("#bulkDrop")?.classList.remove("over");
  const file = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/"));
  if (file) bulkFile(file);
});

boot();
// Offline shell + home-screen install. Only on https (or localhost), where service workers are allowed.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
